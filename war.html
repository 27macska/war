    script.integrity = PEERJS_SRI;       // refuse the file if it is not exactly the version checked
    script.crossOrigin = "anonymous";
    script.onload = resolve;
    script.onerror = () => { script.remove(); reject(new Error("could not load PeerJS")); };
    document.head.append(script);
  });
}

function newSession(peer, me, code) {
  net = { peer, conn: null, me, code, live: false, started: false, gameNo: 0, point: 0, remotePoint: -1 };
  return net;
}

const lobbyStatus = (text) => { $("lobbyStatus").textContent = text; };

function showLobby(view, busy = false) {  // view: "choose" (host or join) or "host" (showing the room code)
  $("lobbyChoose").hidden = view !== "choose";
  $("lobbyHost").hidden = view !== "host";
  for (const id of ["hostBtn", "joinBtn", "codeIn"]) $(id).disabled = busy;
}

function openLobby() {
  stopAuto();
  showLobby("choose");
  lobbyStatus("");
  $("lobby").showModal();
}

function peerProblem(err, code) {
  return {
    "peer-unavailable": `No game found with the code ${code}. Check it with your friend.`,
    "browser-incompatible": "This browser can't make the direct connection online play needs.",
    "network": "Couldn't reach the connection service. Check your internet connection.",
    "server-error": "The connection service isn't responding. Try again in a minute.",
    "socket-error": "The connection service isn't responding. Try again in a minute.",
  }[err.type] || "Something went wrong while connecting. Try again.";
}

async function hostGame() {
  showLobby("choose", true);
  lobbyStatus("Setting up your room…");
  try { await loadPeerJS(); }
  catch (e) { showLobby("choose"); lobbyStatus("Couldn't load online play. Check your internet connection."); return; }
  if ($("lobby").open) openRoom(0);
}

function openRoom(attempt) {
  const code = Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
  const peer = new Peer(ROOM_PREFIX + code);
  const session = newSession(peer, 0, code);
  peer.on("open", () => {
    if (net !== session) return;
    $("roomCode").textContent = code;
    $("copyBtn").textContent = location.protocol.startsWith("http") ? "Copy invite link" : "Copy room code";
    showLobby("host");
    lobbyStatus("Waiting for your friend to join…");
  });
  peer.on("connection", (conn) => {
    if (net !== session || session.conn) { conn.on("open", () => conn.close()); return; }   // a room holds two
    session.conn = conn;
    wire(session, conn);
  });
  peer.on("disconnected", () => { if (net === session && !session.live) peer.reconnect(); });
  peer.on("error", (err) => {
    if (net !== session || session.live) return;
    if (err.type === "unavailable-id" && attempt < 3) { peer.destroy(); openRoom(attempt + 1); return; }   // code taken
    endSession(peerProblem(err, code));
  });
}

async function joinGame(typed) {
  const code = typed.trim().toUpperCase();
  if (!/^[A-Z2-9]{5}$/.test(code)) { lobbyStatus("A room code is 5 letters or numbers."); return; }
  showLobby("choose", true);
  lobbyStatus(`Joining room ${code}…`);
  try { await loadPeerJS(); }
  catch (e) { showLobby("choose"); lobbyStatus("Couldn't load online play. Check your internet connection."); return; }
  if (!$("lobby").open) return;
  const peer = new Peer();
  const session = newSession(peer, 1, code);
  session.timeout = setTimeout(() => {
    if (net === session && !session.live) endSession("Couldn't connect. Check the code, or try a different network.");
  }, 15000);
  peer.on("open", () => {
    if (net !== session) return;
    session.conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
    wire(session, session.conn);
  });
  peer.on("error", (err) => { if (net === session && !session.live) endSession(peerProblem(err, code)); });
}

function wire(session, conn) {
  conn.on("open", () => {
    if (net !== session) return;
    clearTimeout(session.timeout);
    session.live = true;
    if ($("lobby").open) $("lobby").close();
    stopAuto();
    document.body.classList.add("online");
    showNet();
    if (session.me === 0) hostStart();
    else { setStatus("Connected. Waiting for the host to deal…"); updateControls(); }
  });
  conn.on("data", (message) => { if (net === session) receive(message); });
  conn.on("close", () => { if (net === session) endSession("Your opponent left, so you are back in solo play."); });
  conn.on("error", () => { if (net === session) endSession("The connection was lost, so you are back in solo play."); });
}

// Leave online play (or give up connecting). Whatever game is on screen carries on as a solo game.
function endSession(message = "") {
  const session = net;
  net = null;
  if (session) {
    clearTimeout(session.timeout);
    try { session.peer.destroy(); } catch (e) { /* already gone */ }
  }
  document.body.classList.remove("online");
  if (active && active.half) follow();   // the round was waiting for its second card: show it and carry on solo
  tryProceed();                          // Draw 3: the computer takes over Player 2's picks
  if ($("lobby").open) { showLobby("choose"); lobbyStatus(message); showNet(); }
  else showNet(message);
  updateControls();
}

function showNet(message = "") {
  const on = online();
  $("online").textContent = on ? "Leave online game" : "Play online";
  $("net").hidden = !on && !message;
  $("net").textContent = on
    ? `Online game · room ${net.code} · you are Player ${net.me + 1}. ` +
      (draw3() ? "Draw 3: pick a card to play."
               : "Take turns playing a card: the winner of a round plays first in the next.")
    : message;
}

function send(message) {
  try { if (online()) net.conn.send(message); } catch (e) { /* the close handler deals with a dead link */ }
}

// A deck arriving from the other browser must be exactly the 52 cards, nothing else.
function validDeck(deck) {
  if (!Array.isArray(deck) || deck.length !== 52) return false;
  const seen = new Set();
  for (const c of deck) {
    if (!c || !Number.isInteger(c.rank) || c.rank < 2 || c.rank > 14 || !SUITS.includes(c.suit)) return false;
    seen.add(c.rank + c.suit);
  }
  return seen.size === 52;
}

function hostStart() {
  const deck = shuffledDeck();
  net.gameNo++;
  send({ t: "start", v: PROTOCOL, g: net.gameNo, deck, cap: capValue(), mode: $("mode").value });
  start(deck);
  showNet();
}

function receive(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "start" && net.me === 1) {                     // the host has dealt
    if (m.v !== PROTOCOL || !validDeck(m.deck)) {
      endSession("You and your friend have different versions of the game. Both reload the page and try again.");
      return;
    }
    net.gameNo = m.g;
    $("cap").value = Math.max(1, parseInt(m.cap, 10) || 3);
    $("mode").value = m.mode === "draw3" ? "draw3" : "classic";
    start(m.deck.map((c) => ({ rank: c.rank, suit: c.suit })));
    showNet();
  } else if (m.t === "pick" && m.g === net.gameNo && [m.n, m.d, m.k].every(Number.isInteger)) {
    const key = pickKey(m.n, m.d, 1 - net.me);               // the opponent's hidden pick
    if (book[key] === undefined) { book[key] = m.k; tryProceed(); }
  } else if (m.t === "press" && m.g === net.gameNo && Number.isInteger(m.p) && m.p >= net.point) {
    net.remotePoint = Math.max(net.remotePoint, m.p);        // played as soon as this screen is ready for it
    pump();
  } else if (m.t === "new" && net.me === 0 && game.over) {   // the guest asked for another game
    hostStart();
  }
}

// Whose press the game is waiting for (0 or 1), or null while cards are moving by themselves.
function turnSeat() {
  const a = active;
  if (dealing || !net.started) return null;
  if (draw3() && !(a && a.waiting)) return null;               // Draw 3: picks, not turns, outside the face-down cards
  if (!a || a.resolved) return game.over ? null : game.lead;   // a new round: the last winner plays first
  if (a.half) return 1 - a.lead;                               // the second card of the opening flip
  return a.waiting ? duelTurn(a) : null;                       // a face-down duel card
}

// Whose face-down card comes next in a duel: the player who opened the round, then the other,
// and so on. A player with no cards left to place is passed over.
function duelTurn(a) {
  const first = a.lead, second = 1 - first;
  const left = (i) => a.need[i] - a.put[i];
  return left(first) > 0 && (a.put[first] <= a.put[second] || left(second) === 0) ? first : second;
}

function localPress() {
  if (turnSeat() !== net.me) return;
  send({ t: "press", g: net.gameNo, p: net.point });
  play(net.me);
}

// Carry out one press, yours or the opponent's.
function play(seat) {
  const a = active;
  net.point++;
  if (a && a.half) follow();
  else if (a && a.waiting) advanceDuel(seat);
  else step(seat);
}

// Play the opponent's presses that have arrived. Each one waits until this screen has finished
// showing the round before it, so their press never cuts your view of a result short.
function pump() {
  if (pumping || !online()) return;
  pumping = true;
  try {
    const them = 1 - net.me;
    while (online() && net.remotePoint >= net.point && turnSeat() === them && !(active && active.resolved))
      play(them);
  } finally {
    pumping = false;
  }
}

$("online").onclick = () => { if (online()) endSession("You left the online game and are back in solo play."); else openLobby(); };
$("hostBtn").onclick = hostGame;
$("joinBtn").onclick = () => joinGame($("codeIn").value);
$("codeIn").onkeydown = (e) => { if (e.key === "Enter") joinGame($("codeIn").value); };
// Closing the lobby before a connection is made gives up the room or the attempt to join.
const abandonLobby = () => { if (net && !net.live) endSession(); };
$("lobbyClose").onclick = () => { abandonLobby(); $("lobby").close(); };
$("lobby").addEventListener("cancel", abandonLobby);     // Esc key
$("lobby").addEventListener("close", abandonLobby);
$("copyBtn").onclick = async () => {
  const link = location.protocol.startsWith("http");
  try {
    await navigator.clipboard.writeText(link ? `${location.href.split("#")[0]}#${net.code}` : net.code);
    lobbyStatus(link ? "Link copied. Send it to your friend." : "Code copied. Send it to your friend.");
  } catch (e) {
    lobbyStatus("Couldn't copy it. Read the code above out to your friend.");
  }
};
addEventListener("pagehide", () => { if (net) net.peer.destroy(); });   // tell the opponent straight away

$("next").onclick = () => {
  if (dealing) { finishDeal(); return; }
  if (online()) { localPress(); return; }
  if (active && active.waiting) { advanceDuel(); return; }   // auto-play stays on through a duel
  if (active && !active.resolved) return;                    // deciding card is about to flip
  if (draw3()) {                                             // play a random card for you (or start a round with no choice)
    autoOn = false; clearTimeout(autoTimer);
    if (active) settle();
    tryProceed(true);
    return;
  }
  stopAuto();
  step();
};
$("mode").onchange = () => { if (!online()) { stopAuto(); start(); } };   // online: the host's next game uses it
$("duelBtn").onclick = () => {
  if (online()) localPress();
  else if (active && active.waiting) advanceDuel();
};
$("duel").addEventListener("cancel", (e) => e.preventDefault());   // Esc must not dismiss a duel
$("auto").onclick = () => { if (autoOn) stopAuto(); else startAuto(); };
$("speed").onchange = () => { if (autoOn && $("speed").value === "instant") { stopAuto(); startAuto(); } };
$("new").onclick = () => {
  if (!online()) start();
  else if (net.me === 0) hostStart();
  else send({ t: "new" });
};

function showMusic() { $("music").textContent = music.on ? "Music: On" : "Music: Off"; }
$("music").onclick = () => { music.setOn(!music.on); showMusic(); };
$("vol").value = Math.round(music.volume * 100);
$("vol").oninput = () => music.setVolume($("vol").value / 100);
showMusic();

start();

// An invite link ends in #ROOMCODE: join that room straight away.
const invite = location.hash.match(/^#([A-Za-z2-9]{5})$/);
if (invite) {
  openLobby();
  $("codeIn").value = invite[1].toUpperCase();
  joinGame(invite[1]);
}
</script>
</body>
</html>
