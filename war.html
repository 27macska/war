<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War</title>
<style>
  :root {
    --bg: #14532d; --panel: #166534; --ink: #f0fdf4; --muted: #bbf7d0;
    --card: #ffffff; --card-ink: #111827; --red: #b91c1c; --back: #1e3a8a;
    --accent: #facc15; --accent-ink: #1c1917; --duel: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; position: relative; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 1.5rem; }
  .music, .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls { margin-bottom: 12px; }
  button, select, input {
    font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid transparent;
  }
  button { background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  #next { min-width: 13.5em; }
  #next.duel { background: var(--duel); color: #fff; }
  label { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 6px; }
  input[type=number] { width: 70px; }
  input[type=range] { padding: 0; width: 110px; accent-color: var(--accent); }
  .player { background: var(--panel); border-radius: 12px; padding: 12px; }
  .player.winner { outline: 3px solid var(--accent); }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .name { font-weight: 700; }
  .info { color: var(--muted); font-variant-numeric: tabular-nums; }
  .table { display: flex; gap: 14px; align-items: flex-start; }
  .piles { display: flex; gap: 6px; flex: none; }
  .pile { width: 70px; text-align: center; font-size: .8rem; color: var(--muted); }
  .stack {
    width: 52px; height: 76px; border-radius: 7px; margin: 0 18px 18px 0;
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, var(--back) 0 6px, #3b82f6 6px 12px);
    border: 3px solid var(--card); transition: box-shadow .15s;
  }
  .stack span {
    background: rgba(0,0,0,.65); color: #fff; font-weight: 700; font-size: .95rem;
    min-width: 30px; padding: 2px 6px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .stack.empty { background: none; border: 2px dashed var(--muted); opacity: .6; }
  .stack.pulse { animation: pulse .22s ease-out; }
  @keyframes pulse { 40% { transform: scale(1.14); } }
  .laid { display: flex; flex-wrap: wrap; gap: 6px; min-height: 76px; flex: 1; }
  .card {
    width: 52px; height: 76px; border-radius: 7px; background: var(--card); color: var(--card-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.15rem; line-height: 1.1; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    position: relative;
  }
  .card.red { color: var(--red); }
  .card.down {
    background: repeating-linear-gradient(45deg, var(--back) 0 6px, #3b82f6 6px 12px);
    border: 3px solid var(--card);
  }
  .card.best { outline: 3px solid var(--accent); }
  .card.deal { animation: deal .14s ease-out; }
  @keyframes deal { from { transform: translateX(-24px); opacity: 0; } }
  /* Draw 3 mode: the hand each player picks from */
  .hand { margin-top: 10px; }
  .hand > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .hand > span.go { color: var(--accent); font-weight: 700; }
  .hcards { display: flex; flex-wrap: wrap; gap: 8px; min-height: 76px; padding-top: 10px; }
  .hcards .card { transition: transform .12s, box-shadow .12s; }
  button.card.pick {
    padding: 0; border: 0; border-radius: 7px; background: var(--card); color: var(--card-ink);
    font-size: 1.15rem; cursor: pointer;
  }
  button.card.pick.red { color: var(--red); }
  button.card.pick:disabled { opacity: 1; cursor: default; }
  button.card.pick:not(:disabled) { box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.4); }
  button.card.pick:not(:disabled):hover, button.card.pick:not(:disabled):focus-visible {
    transform: translateY(-8px); box-shadow: 0 0 0 3px var(--accent), 0 8px 14px rgba(0,0,0,.5); outline: none;
  }
  .hcards .card.chosen { transform: translateY(-10px); outline: 3px solid var(--accent); }
  #status { text-align: center; padding: 12px 4px; font-weight: 600; min-height: 3.2em; }
  #status.duel { color: var(--accent); font-size: 1.1rem; }
  #log {
    margin-top: 12px; max-height: 220px; overflow-y: auto; background: rgba(0,0,0,.25);
    border-radius: 12px; padding: 8px 12px; font-size: .9rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #log div { padding: 2px 0; }
  dialog {
    width: min(92vw, 440px); padding: 20px; border: 3px solid var(--duel); border-radius: 16px;
    background: #1c1917; color: #fff; text-align: center; box-shadow: 0 0 40px rgba(220, 38, 38, .6);
    overflow-x: hidden;                   /* titles slam in oversized; that must not add a scrollbar */
  }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }
  dialog h2 { margin: 0 0 4px; font-size: 2.2rem; letter-spacing: .08em; color: var(--accent); }
  dialog p { margin: 0 0 14px; min-height: 2.8em; }
  .drow { text-align: left; margin-bottom: 12px; }
  .drow > span { display: block; font-size: .85rem; color: #d6d3d1; margin-bottom: 4px; }
  .dcards { display: flex; flex-wrap: wrap; gap: 6px; min-height: 76px; }
  #duelBtn {                              /* stays in view even when a long duel makes the popup scroll */
    background: var(--duel); color: #fff; width: 100%; padding: 12px; font-size: 1.05rem;
    position: sticky; bottom: 0; z-index: 1;
  }
  /* Online play */
  [hidden] { display: none !important; }
  body.online #auto, body.online .speed { display: none; }
  #net {
    margin-bottom: 12px; padding: 8px 12px; border-radius: 8px;
    background: rgba(0, 0, 0, .25); color: var(--muted); font-size: .9rem;
  }
  .badge {                                /* online: marks the player whose turn it is */
    margin-left: 8px; padding: 1px 8px; border-radius: 999px; vertical-align: 2px;
    background: var(--accent); color: var(--accent-ink); font-size: .75rem; font-weight: 700;
  }
  .badge.theirs { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--muted); }
  #lobby { border-color: var(--accent); box-shadow: 0 0 40px rgba(250, 204, 21, .35); }
  #lobby h2 { font-size: 1.5rem; letter-spacing: 0; margin-bottom: 8px; }
  #lobby p { min-height: 0; margin-bottom: 12px; }
  #lobby .row { display: flex; gap: 8px; margin-bottom: 10px; }
  #lobby .row > * { flex: 1; min-width: 0; }
  #codeIn { text-transform: uppercase; text-align: center; letter-spacing: .2em; font-weight: 700; }
  #roomCode { font-size: 2.2rem; font-weight: 800; letter-spacing: .25em; color: var(--accent); margin: 2px 0 10px; }
  #lobbyStatus { min-height: 1.4em; color: #fde68a; }
  /* Deciding duel card: two-sided, so it can arrive face down and turn over */
  .flip { width: 52px; height: 76px; position: relative; z-index: 2; }
  .flip .wrap { width: 100%; height: 100%; perspective: 500px; }
  .flip .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .flip .inner > .card { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; }
  .flip .inner > .card.down { transform: rotateY(180deg); }
  .win .card:not(.down), .card.win { outline: 3px solid var(--accent); box-shadow: 0 0 22px 6px var(--accent); }
  .lose { opacity: .45; filter: grayscale(1); }
  #sparks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3; }
  /* Layer for the deck being shuffled and dealt at the start of a game */
  #mid { position: relative; }
  #dealer { position: absolute; left: 50%; top: 50%; z-index: 20; pointer-events: none; }
  #dealer .card { box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .spark { position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%; opacity: 0; }
  /* Close call: a round won by a single rank (see closeCall) */
  #bannerBox {                            /* clips the banner while it slams in oversized, so the page never scrolls sideways */
    position: absolute; inset: -90px -16px; overflow: hidden; pointer-events: none; z-index: 15;
  }
  #banner {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; rotate: -3deg;
    white-space: nowrap; text-align: center; padding: 8px 22px;
    border: 3px solid var(--accent); border-radius: 14px; background: rgba(28, 25, 23, .94); color: #fff;
    box-shadow: 0 0 30px rgba(250, 204, 21, .55);
  }
  #banner strong { display: block; font-size: 2rem; line-height: 1.15; letter-spacing: .08em; color: var(--accent); }
  #tableSparks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; }
  .card.tense { z-index: 5; box-shadow: 0 0 16px 4px rgba(250, 204, 21, .7); }
  .call { display: inline-block; color: var(--accent); font-size: 1.4em; letter-spacing: .06em; }
  /* Ace beats king: the table goes dark, the ace strikes the king and takes its crown (see strikeKing) */
  #dim {
    position: fixed; inset: 0; z-index: 25; pointer-events: none;
    background: #000; opacity: 0; transition: opacity .35s;
  }
  #dim.on { opacity: .6; }
  .card.royal { z-index: 40; }            /* above the darkness */
  .card.strike { z-index: 41; }
  .card.slain { background: #d6d3d1; color: #57534e; box-shadow: none; }
  .card.slain::after {                    /* the slash left across the king */
    content: ""; position: absolute; left: -40%; right: -40%; top: 50%; height: 5px; margin-top: -2.5px;
    rotate: -56deg; border-radius: 3px; box-shadow: 0 0 8px #dc2626;
    background: linear-gradient(90deg, transparent, #dc2626 15%, #fff 50%, #dc2626 85%, transparent);
  }
  .crown {
    position: absolute; left: 50%; top: -21px; translate: -50% 0; rotate: -10deg; z-index: 2;
    font-size: 26px; line-height: 1; pointer-events: none; filter: drop-shadow(0 0 5px #facc15);
  }
  .ring {
    position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
    border: 4px solid #fde047; opacity: 0;
  }
  #banner.royal { background: linear-gradient(180deg, #fde047, #f59e0b); color: #1c1917; border-color: #fffbeb; }
  #banner.royal strong { color: #1c1917; }
  .call.royal { color: #fde047; text-shadow: 0 0 10px #f59e0b; }
  @media (max-height: 560px) {           /* short windows: a compact popup that still fits */
    .dcards .flip { width: 36px; height: 52px; }
    dialog { padding: 10px; }
    dialog h2 { font-size: 1.25rem; }
    dialog p { margin-bottom: 6px; min-height: 0; font-size: .85rem; }
    .drow { margin-bottom: 6px; }
    .drow > span { font-size: .75rem; margin-bottom: 2px; }
    .dcards { gap: 4px; min-height: 52px; }
    .dcards .card { width: 36px; height: 52px; font-size: .9rem; }
    #duelBtn { padding: 6px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: pop .28s cubic-bezier(.2, 1.5, .4, 1); }
    dialog h2.shake { animation: shake .5s; }
    dialog h2.slam { animation: titleSlam .4s cubic-bezier(.2, 1.6, .4, 1); }
    /* The deciding card's timeline (1.48s, matches REVEAL): rise, tremble, turn over, slam down */
    .flip { animation: rise .25s ease-out both, slam .18s ease-in 1.3s forwards; }
    .flip .wrap { animation: tremble .1s linear .25s 8 alternate; }
    .flip .inner { animation: turn .3s ease-in-out 1s both; }
    .flip.win { animation: winPop .5s ease-out forwards; }
    .flip.lose { animation: loseDrop .5s ease-in forwards; }
    dialog.impact { animation: quake .45s linear; }
    dialog.impact::backdrop { animation: flashBg .5s ease-out; }
    .spark { animation: spark .8s ease-out forwards; }
    /* Close call: both cards strain, then the winner lunges, the loser recoils and the banner slams down */
    .card.tense { animation: swell .5s ease-out forwards, quiver .08s linear infinite alternate; }
    .card.clash.win { animation: clashWin .55s cubic-bezier(.2, 1.4, .4, 1); }
    .card.clash.lose { animation: clashLose .55s ease-out; }
    #banner.show { animation: stamp .4s cubic-bezier(.2, 1.5, .4, 1), halo .8s ease-out; }
    .call { animation: stamp .4s cubic-bezier(.2, 1.5, .4, 1); }
    main.jolt, dialog.jolt { animation: jolt .4s linear; }
    /* Ace beats king. The ace's flight is .9s and its blow lands at 42% (STRIKE and STRIKE_HIT in the script) */
    .card.strike { animation: strike .9s linear; }
    .card.slain { animation: knocked .8s ease-out; }
    .card.slain::after { animation: slash .2s ease-out both; }
    #dim.flash { animation: goldFlash .6s ease-out; }
    .ring { animation: ring .6s ease-out forwards; }
    .flip .crown { animation: crownDrop .5s cubic-bezier(.3, 1.5, .5, 1) both; }
  }
  @keyframes rise { from { transform: scale(.4); opacity: 0; } to { transform: scale(1.5); opacity: 1; } }
  @keyframes tremble { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  @keyframes turn { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
  @keyframes slam { from { transform: scale(1.5); } 70% { transform: scale(.9); } to { transform: scale(1); } }
  @keyframes winPop { 40% { transform: scale(1.5); } to { transform: scale(1.2); } }
  @keyframes loseDrop { to { transform: translateY(8px) rotate(8deg) scale(.9); } }
  @keyframes quake {
    0% { transform: scale(1.05); box-shadow: 0 0 140px 50px #fff; }
    15% { transform: translate(-10px, 6px) rotate(-1.5deg); } 30% { transform: translate(9px, -7px) rotate(1.5deg); }
    45% { transform: translate(-7px, -4px); } 60% { transform: translate(6px, 5px); } 75% { transform: translate(-3px, 2px); }
  }
  @keyframes flashBg { from { background: rgba(255, 255, 255, .9); } }
  @keyframes titleSlam { from { transform: scale(3); opacity: 0; } }
  @keyframes spark {
    from { opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  @keyframes shake {
    20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  @keyframes swell { to { scale: 1.3; } }
  @keyframes quiver { from { rotate: -5deg; } to { rotate: 5deg; } }
  @keyframes clashWin { from { scale: 1.3; } 35% { scale: 1.9; rotate: -8deg; } }
  @keyframes clashLose { from { scale: 1.3; } 35% { scale: .8; rotate: 12deg; translate: 0 8px; } }
  @keyframes stamp { from { scale: 3.5; opacity: 0; } }
  @keyframes halo {
    from { box-shadow: 0 0 30px rgba(250, 204, 21, .55), 0 0 0 0 rgba(250, 204, 21, .9); }
    to { box-shadow: 0 0 30px rgba(250, 204, 21, .55), 0 0 0 70px rgba(250, 204, 21, 0); }
  }
  @keyframes jolt {
    15% { transform: translate(-7px, 4px) rotate(-.6deg); } 30% { transform: translate(6px, -5px) rotate(.6deg); }
    45% { transform: translate(-5px, -3px); } 60% { transform: translate(4px, 3px); } 80% { transform: translate(-2px, 1px); }
  }
  /* --dx/--dy: from the ace to the king. The ace winds up, spins across, lands its blow and returns. */
  @keyframes strike {
    0% { scale: 1.3; animation-timing-function: ease-out; }
    18% { translate: calc(var(--dx) * -.12) calc(var(--dy) * -.12); scale: 1.5; rotate: -14deg; animation-timing-function: ease-in; }
    42% { translate: var(--dx) var(--dy); scale: 1.5; rotate: 360deg; }
    58% { translate: var(--dx) var(--dy); scale: 1.35; rotate: 360deg; animation-timing-function: ease-in-out; }
    100% { translate: 0 0; scale: 1; rotate: 360deg; }
  }
  /* --kx/--ky: the way the king is knocked. It spins once round and comes to rest where it stood. */
  @keyframes knocked {
    0% { scale: 1.3; }
    35% { translate: var(--kx) var(--ky); rotate: 250deg; scale: .85; }
    100% { translate: 0 0; rotate: 360deg; scale: 1; }
  }
  @keyframes slash { from { scale: 0 1; } }
  @keyframes goldFlash { from { background: #facc15; opacity: .55; } to { background: #facc15; opacity: 0; } }
  @keyframes ring { from { scale: .3; opacity: 1; } to { scale: 7; opacity: 0; } }
  @keyframes crownDrop { from { translate: -50% -70px; scale: 2; opacity: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>War</h1>
    <div class="music">
      <button id="online" class="secondary">Play online</button>
      <button id="music" class="secondary">Music: On</button>
      <label>Volume <input id="vol" type="range" min="0" max="100" value="25"></label>
    </div>
  </header>
  <div id="net" role="status" hidden></div>
  <div class="controls">
    <button id="next">Next round</button>
    <button id="auto" class="secondary">Auto-play</button>
    <label class="speed">Speed
      <select id="speed">
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
        <option value="instant">Instant</option>
      </select>
    </label>
    <label>Mode
      <select id="mode">
        <option value="classic" selected>Classic</option>
        <option value="draw3">Draw 3</option>
      </select>
    </label>
    <label>Deck passes <input id="cap" type="number" min="1" value="3"></label>
    <button id="new" class="secondary">New game</button>
  </div>

  <section class="player" id="p0">
    <div class="head"><span class="name"><span class="who">Player 1</span><span class="badge" hidden></span></span><span class="info"></span></div>
    <div class="table">
      <div class="piles">
        <div class="pile"><div class="stack" data-kind="draw"></div>Draw</div>
        <div class="pile"><div class="stack" data-kind="won"></div>Won</div>
      </div>
      <div class="laid"></div>
    </div>
    <div class="hand" hidden><span></span><div class="hcards"></div></div>
  </section>
  <div id="mid">
    <div id="status"></div>
    <div id="dealer"></div>
    <div id="bannerBox"><div id="banner" aria-hidden="true" hidden><strong>CLOSE CALL!</strong><span></span></div></div>
  </div>
  <section class="player" id="p1">
    <div class="head"><span class="name"><span class="who">Player 2</span><span class="badge" hidden></span></span><span class="info"></span></div>
    <div class="table">
      <div class="piles">
        <div class="pile"><div class="stack" data-kind="draw"></div>Draw</div>
        <div class="pile"><div class="stack" data-kind="won"></div>Won</div>
      </div>
      <div class="laid"></div>
    </div>
    <div class="hand" hidden><span></span><div class="hcards"></div></div>
  </section>

  <div id="log"></div>
  <div id="tableSparks"></div>
</main>
<div id="dim"></div>

<dialog id="duel" aria-labelledby="duelTitle">
  <h2 id="duelTitle">DUEL!</h2>
  <p id="duelText"></p>
  <div class="drow"><span id="dn0">Player 1</span><div class="dcards" id="d0"></div></div>
  <div class="drow"><span id="dn1">Player 2</span><div class="dcards" id="d1"></div></div>
  <div class="drow" id="duelHand" hidden><span>Your hand</span><div class="dcards"></div></div>
  <button id="duelBtn">Place duel card 1 of 3</button>
  <div id="sparks"></div>
</dialog>

<dialog id="lobby" aria-labelledby="lobbyTitle">
  <h2 id="lobbyTitle">Play online</h2>
  <p>Play a friend over the internet. One of you hosts and shares the room code, and the other joins with it.</p>
  <div id="lobbyChoose">
    <div class="row"><button id="hostBtn">Host a game</button></div>
    <div class="row">
      <input id="codeIn" maxlength="5" placeholder="Room code" autocomplete="off" spellcheck="false" aria-label="Room code">
      <button id="joinBtn">Join</button>
    </div>
  </div>
  <div id="lobbyHost" hidden>
    <div>Your room code</div>
    <div id="roomCode"></div>
    <div class="row"><button id="copyBtn" class="secondary">Copy room code</button></div>
  </div>
  <p id="lobbyStatus" role="status"></p>
  <div class="row"><button id="lobbyClose" class="secondary">Cancel</button></div>
</dialog>

<script>
// ---------- Game logic (no DOM) ----------
const SUITS = ["♠", "♥", "♦", "♣"];
const FACE_DOWN_PER_DUEL = 3;
const HAND_SIZE = 3;                    // Draw 3 mode: cards each player holds to choose from

function rankLabel(rank) {
  return { 11: "J", 12: "Q", 13: "K", 14: "A" }[rank] || String(rank);
}

function shuffledDeck() {
  const deck = [];
  for (const suit of SUITS)
    for (let rank = 2; rank <= 14; rank++) deck.push({ rank, suit }); // ace = 14 (high)
  for (let i = deck.length - 1; i > 0; i--) {                         // Fisher-Yates shuffle
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

// `deck` is the 52 cards in dealing order. Online games pass in the host's deck so both screens match.
// `mode`: "classic" (the top card is played) or "draw3" (each player holds a hand of 3 and picks
// the card they play, and the deciding card of each duel; the face-down duel cards still come off the pile).
function newGame(cap, deck = shuffledDeck(), mode = "classic") {
  const g = {
    players: [
      { draw: deck.slice(0, 26), won: [], refills: 0, hand: [] },
      { draw: deck.slice(26), won: [], refills: 0, hand: [] },
    ],
    round: 0, cap, over: false, winner: null, reason: null, mode,
    lead: 0,          // who plays first in the next round when players take turns: the last round's winner
  };
  if (mode === "draw3") fillHands(g);
  return g;
}

const count = (p) => p.draw.length + p.won.length + p.hand.length;

// Draw 3 mode: top each hand back up to HAND_SIZE from the draw pile.
function fillHands(g) {
  for (const p of g.players)
    while (p.hand.length < HAND_SIZE && p.draw.length + p.won.length > 0) p.hand.push(drawCard(p));
}

// Take the top card. When the draw pile is empty, the won pile becomes the
// new draw pile in the order the cards were won (no shuffle).
function drawCard(p) {
  if (p.draw.length === 0 && p.won.length > 0) { p.draw = p.won; p.won = []; p.refills++; }
  return p.draw.shift() || null;
}

// A pass is one trip through a draw pile. The pass a player is on is
// refills + 1; it is finished once that draw pile is empty.
const passesDone = (p) => p.refills + (p.draw.length === 0 ? 1 : 0);

// Plays one whole round, duels included. Every card put on the table is recorded
// with the duel it belongs to (0 = the opening flip) so the screen can replay it in steps.
// Draw 3 mode: picks[i][d] is the index in player i's hand of the face-up card they play in duel d
// (0 = the opening). A player holding one card plays it and one holding none plays off the pile,
// without a pick. If a pick that is needed is missing, the round stops there and returns
// { pending: d, choosing, hands, laid, ... }; that leaves `g` half played, so look ahead on a copy.
function playRound(g, picks = [[], []]) {
  if (g.over) return null;
  const hands = g.mode === "draw3";
  const laid = [[], []];                       // cards each player put on the table
  const up = [null, null];                     // each player's current face-up card
  const choosing = () => g.players.map((p) => hands && p.hand.length >= 2);
  const missing = (d) => choosing().some((c, i) => c && !Number.isInteger(picks[i][d]));
  const pending = (d) => ({
    round: g.round + 1, laid, up, winner: null, duels: d, potSize: 0, lastCardStands: [false, false],
    pending: d, choosing: choosing(), hands: g.players.map((p) => p.hand.map((c) => ({ ...c }))),
  });
  const playUp = (i, d) => {                   // the face-up card: from the hand if holding any
    const p = g.players[i], fromHand = hands && p.hand.length > 0;
    let card;
    if (!fromHand) card = drawCard(p);
    else if (p.hand.length === 1) card = p.hand.pop();
    else card = p.hand.splice(Math.max(0, Math.min(picks[i][d], p.hand.length - 1)), 1)[0];
    up[i] = card;
    laid[i].push({ card, up: true, duel: d, fromHand });
  };

  if (missing(0)) return pending(0);
  for (const i of [0, 1]) playUp(i, 0);

  let duels = 0, winner = null;
  const lastCardStands = [false, false];
  while (true) {
    if (up[0].rank !== up[1].rank) { winner = up[0].rank > up[1].rank ? 0 : 1; break; }
    if (count(g.players[0]) === 0 && count(g.players[1]) === 0) break; // nobody can continue
    duels++;
    const playing = [false, false];
    for (const i of [0, 1]) {
      const p = g.players[i];
      if (count(p) === 0) { lastCardStands[i] = true; continue; }  // out of cards: last card stays face up
      playing[i] = true;
      const pile = p.draw.length + p.won.length;
      const down = Math.min(FACE_DOWN_PER_DUEL, hands && p.hand.length ? pile : pile - 1);  // always keep one card to flip
      for (let k = 0; k < down; k++) laid[i].push({ card: drawCard(p), up: false, duel: duels });
    }
    if (missing(duels)) return pending(duels);
    for (const i of [0, 1]) if (playing[i]) playUp(i, duels);
  }

  g.round++;
  const potSize = laid[0].length + laid[1].length;
  if (winner !== null) {
    // Winner's cards first, then the loser's, onto the bottom of the won pile.
    const pot = [...laid[winner], ...laid[1 - winner]].map((x) => x.card);
    g.players[winner].won.push(...pot);
    g.lead = winner;
  } else {
    for (const i of [0, 1]) g.players[i].won.push(...laid[i].map((x) => x.card));
  }
  if (hands) fillHands(g);

  const c =[count(g.players[0]), count(g.players[1])];
  if (winner === null) {
    g.over = true; g.reason = "stalemate";
  } else if (c[1 - winner] === 0) {
    g.over = true; g.winner = winner; g.reason = "cards";
  } else if (g.players.some((p) => passesDone(p) >= g.cap)) {
    g.over = true; g.reason = "cap";
    g.winner = c[0] === c[1] ? null : (c[0] > c[1] ? 0 : 1);
  }
  const close = winner !== null && Math.abs(up[0].rank - up[1].rank) === 1;   // won by a single rank
  const kingslayer = close && up[winner].rank === 14;                         // an ace beat a king
  return { round: g.round, laid, up, winner, duels, potSize, lastCardStands, close, kingslayer };
}

// Draw 3 mode: the computer's pick. It can't see the other hand, so it plays its best card in a duel
// (the pot is big) and otherwise mixes it up, usually holding its best card back.
function cpuChoose(hand, duel) {
  const order = hand.map((c, k) => k).sort((a, b) => hand[a].rank - hand[b].rank);
  if (duel > 0) return order[order.length - 1];
  const roll = Math.random();
  return order[roll < 0.3 ? 0 : roll < 0.8 ? Math.floor((order.length - 1) / 2) : order.length - 1];
}

// Draw 3 mode: a whole round with the computer picking for both players (used by instant auto-play).
function cpuRound(g) {
  const picks = [[], []];
  for (;;) {
    const p = playRound(structuredClone(g), picks);
    if (p.pending === undefined) break;
    for (const i of [0, 1])
      if (p.choosing[i] && !Number.isInteger(picks[i][p.pending])) picks[i][p.pending] = cpuChoose(p.hands[i], p.pending);
  }
  return playRound(g, picks);
}

// ---------- Music (generated by the browser, no audio files) ----------
const music = (() => {
  const STEP = 60 / 104 / 4;            // length of a 16th note at 104 beats per minute
  const GAIN = 2;                       // overall loudness when the volume slider is at 100%
  // An 8-bar march in A minor. Notes are MIDI numbers; 16 steps to a bar.
  const MELODY = {                      // step: [note, length in steps]
    0: [69, 6], 6: [72, 2], 8: [76, 8],
    16: [77, 4], 20: [76, 4], 24: [72, 8],
    32: [67, 6], 38: [72, 2], 40: [76, 4], 44: [74, 4],
    48: [74, 8], 56: [71, 4], 60: [67, 4],
    64: [69, 6], 70: [72, 2], 72: [76, 4], 76: [81, 4],
    80: [81, 4], 84: [79, 2], 86: [77, 2], 88: [76, 8],
    96: [74, 4], 100: [77, 4], 104: [76, 4], 108: [74, 4],
    112: [76, 10], 124: [68, 2], 126: [71, 2],
  };
  const ROOT  = [45, 41, 48, 43, 45, 41, 50, 40];          // bass note on beats 1 and 3 of each bar
  const FIFTH = [52, 48, 43, 50, 52, 48, 45, 47];          // bass note on beats 2 and 4
  const CHORD = [[57, 60, 64], [57, 60, 65], [55, 60, 64], [55, 59, 62],
                 [57, 60, 64], [57, 60, 65], [57, 62, 65], [56, 59, 64]];
  const SNARE = [0, 4, 6, 7, 8, 12, 14];                   // snare hits within a bar

  // Duel section: a 4-bar chiptune metalcore loop at 160 beats per minute.
  // Bars 1-2 are fast (double kick on every 16th, snare on beats 2 and 4);
  // bars 3-4 are a half-time breakdown (kick follows the riff, snare on beat 3).
  const DUEL_STEP = 60 / 160 / 4;
  const _ = null;
  const RIFF = [                        // palm-muted chord per 16th, in semitones above low D; _ = silence
    0, 0, _, 0,  0, _, 0, 0,  3, _, 0, 0,  1, _, 0, _,
    0, 0, _, 0,  0, _, 0, 0,  6, _, 5, _,  3, _, 1, _,
    0, _, _, 0,  0, _, _, _,  0, _, 0, _,  _, 0, 0, _,
    0, _, _, 0,  0, _, _, _,  0, 0, _, 0,  1, 1, _, _,
  ];
  const SOLO = {                        // lead line over the fast bars: step: [note, length in steps]
    0: [74, 2], 2: [77, 2], 4: [81, 4], 8: [79, 2], 10: [77, 2], 12: [76, 4],
    16: [77, 2], 18: [81, 2], 20: [86, 4], 24: [84, 2], 26: [82, 2], 28: [81, 4],
  };
  const CRUNCH = new Float32Array(1024);                   // distortion curve for the riff
  for (let i = 0; i < CRUNCH.length; i++) CRUNCH[i] = Math.tanh(6 * (i / 511.5 - 1));

  let ctx = null, master, bus, noise;
  let timer = null, pos = 0, nextTime = 0;
  let on = true, volume = 0.25, mode = "march";
  try {
    on = localStorage.getItem("war-music") !== "off";
    const v = parseFloat(localStorage.getItem("war-volume"));
    if (v >= 0 && v <= 1) volume = v;
  } catch (e) { /* storage unavailable: keep defaults */ }
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };

  function filter(type, freq) {
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq;
    return f;
  }

  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const limiter = ctx.createDynamicsCompressor();          // keeps loud moments from distorting
    limiter.threshold.value = -6; limiter.knee.value = 6; limiter.ratio.value = 12;
    limiter.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = volume * GAIN; master.connect(limiter);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const data = noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    bus = makeBus();
  }

  // Each section of music plays through its own bus, so the old section can be
  // cut off cleanly the moment the music switches.
  function makeBus() {
    const out = ctx.createGain();
    out.gain.value = SECTIONS[mode].level;
    out.connect(master);
    const lead = filter("lowpass", 1500); lead.connect(out);
    const bass = filter("lowpass", 700); bass.connect(out);
    const crunch = ctx.createWaveShaper(), tame = filter("lowpass", 2200), level = ctx.createGain();
    crunch.curve = CRUNCH; level.gain.value = 0.22;
    crunch.connect(tame); tame.connect(level); level.connect(out);
    return { out, lead, bass, crunch };
  }

  function setMode(next) {
    if (next === mode) return;
    mode = next; pos = 0;
    if (!ctx) return;
    const old = bus.out;
    old.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
    setTimeout(() => old.disconnect(), 500);
    bus = makeBus();
    nextTime = ctx.currentTime + 0.06;                     // start the new section straight away
  }

  function tone(type, midi, t, dur, peak, out, attack = 0.02) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = 440 * 2 ** ((midi - 69) / 12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(peak * 0.5, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }

  // A burst of filtered noise: snares and cymbals.
  function hit(t, peak, decay, highpass, out = bus.out) {
    const s = ctx.createBufferSource(), f = filter("highpass", highpass), g = ctx.createGain();
    s.buffer = noise;
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + decay + 0.02);
  }

  // A tone that drops quickly in pitch: the bass drum.
  function kick(t, peak) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.07);
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g); g.connect(bus.out);
    o.start(t); o.stop(t + 0.12);
    hit(t, peak * 0.15, 0.02, 3000);                       // click so it cuts through small speakers
  }

  function marchStep(s, t) {
    const bar = s >> 4, beat = s & 15;
    const note = MELODY[s];
    if (note) tone("square", note[0], t, note[1] * STEP, 0.12, bus.lead);
    if (beat % 4 === 0) tone("square", beat % 8 === 0 ? ROOT[bar] : FIFTH[bar], t, STEP * 3.6, 0.16, bus.bass);
    if (beat === 0) for (const n of CHORD[bar]) tone("sine", n, t, STEP * 16, 0.05, bus.out);
    if (SNARE.includes(beat)) hit(t, beat % 4 === 0 ? 0.1 : 0.05, 0.09, 1800);
  }

  function duelStep(s, t) {
    const bar = s >> 4, beat = s & 15, fast = bar < 2;
    const chug = RIFF[s];
    if (chug !== null)                                     // low D power chord: root, fifth, octave
      for (const n of [38, 45, 50]) tone("sawtooth", n + chug, t, DUEL_STEP * 0.9, 0.12, bus.crunch, 0.004);
    if (fast || chug !== null) kick(t, 0.5);
    if (fast ? beat === 4 || beat === 12 : beat === 8) {   // snare: noise plus a short thump
      hit(t, 0.3, 0.16, 900);
      tone("triangle", 55, t, 0.08, 0.2, bus.out, 0.003);
    }
    if (beat === 0 && bar % 2 === 0) hit(t, 0.16, 0.5, 5000);          // crash opens each half
    else if (!fast && beat % 4 === 0) hit(t, 0.1, 0.22, 4000);         // china on every beat of the breakdown
    else if (fast && beat % 2 === 0) hit(t, 0.035, 0.04, 7000);        // hi-hat
    const note = SOLO[s];
    if (note) tone("square", note[0], t, note[1] * DUEL_STEP, 0.1, bus.lead);
  }

  // Victory section, played once a player has won: an 8-bar power-metal fanfare in C major at
  // 150 beats per minute. Distorted power chords gallop under a harmonised lead, so it is both
  // heavier than the march and unmistakably different from it (major key, faster, guitars).
  const WIN_STEP = 60 / 150 / 4;
  const FANFARE = {                     // step: [note, length in steps]
    0: [72, 2], 2: [72, 1], 3: [72, 1], 4: [76, 4], 8: [79, 4], 12: [76, 2], 14: [79, 2],
    16: [81, 6], 22: [79, 2], 24: [77, 4], 28: [81, 4],
    32: [79, 2], 34: [79, 1], 35: [79, 1], 36: [83, 4], 40: [86, 4], 44: [83, 2], 46: [86, 2],
    48: [84, 8], 56: [79, 4], 60: [76, 4],
    64: [76, 2], 66: [81, 2], 68: [84, 4], 72: [83, 2], 74: [81, 2], 76: [76, 4],
    80: [77, 2], 82: [81, 2], 84: [84, 4], 88: [81, 2], 90: [79, 2], 92: [77, 4],
    96: [79, 4], 100: [81, 4], 104: [83, 4], 108: [86, 4],
    112: [84, 12], 124: [79, 2], 126: [79, 2],
  };
  const WIN_ROOT = [48, 41, 43, 48, 45, 41, 43, 48];       // chord of each bar: C F G C Am F G C
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];

  function thirdBelow(midi) {                              // harmony note two scale steps under the melody
    const note = midi - (midi % 12) + MAJOR[(MAJOR.indexOf(midi % 12) + 5) % 7];
    return note > midi ? note - 12 : note;
  }

  function powerChord(root, t, dur) {                      // root, fifth and octave through the distortion
    for (const n of [root, root + 7, root + 12]) tone("sawtooth", n, t, dur, 0.11, bus.crunch, 0.004);
  }

  function victoryStep(s, t) {
    const bar = s >> 4, beat = s & 15, sub = beat & 3, root = WIN_ROOT[bar];
    const note = FANFARE[s];
    if (note) {                                            // twin lead: the melody and a third below it
      tone("square", note[0], t, note[1] * WIN_STEP, 0.12, bus.lead);
      tone("sawtooth", thirdBelow(note[0]), t, note[1] * WIN_STEP, 0.07, bus.lead);
    }
    if (bar === 7) {                                       // last bar: one big held chord, then a drum fill
      if (beat === 0) {
        powerChord(root, t, WIN_STEP * 11);
        tone("square", root - 12, t, WIN_STEP * 11, 0.14, bus.bass);
        kick(t, 0.5);
        hit(t, 0.16, 0.7, 5000);
      }
      if (beat >= 8) {
        hit(t, 0.1 + (beat - 8) * 0.03, 0.1, 900);
        if (beat % 2 === 0) kick(t, 0.4);
      }
      return;
    }
    if (sub !== 1) {                                       // gallop: long-short-short on every beat
      powerChord(root, t, WIN_STEP * (sub === 0 ? 1.9 : 0.9));
      kick(t, 0.45);
    }
    if (sub === 0) tone("square", root - 12, t, WIN_STEP * 3.6, 0.14, bus.bass);
    if (beat === 4 || beat === 12) {                       // snare on beats 2 and 4
      hit(t, 0.3, 0.16, 900);
      tone("triangle", 55, t, 0.08, 0.2, bus.out, 0.003);
    }
    if (beat === 0 && bar % 4 === 0) hit(t, 0.16, 0.6, 5000);          // crash every four bars
    else if (sub === 0) hit(t, 0.05, 0.1, 6000);                       // ride on each beat
  }

  // Suspense before the deciding duel card: nothing but a snare roll that keeps swelling.
  function rollStep(s, t) {
    hit(t, Math.min(0.06 + s * 0.008, 0.3), 0.05, 1200);
    if (s % 8 === 0) kick(t, 0.35);
  }

  // A short snare roll that swells: the moment before a close result is settled.
  function swell(seconds) {
    if (!ctx || !timer) return;
    const n = Math.floor(seconds / 0.04);
    for (let k = 0; k < n; k++) hit(ctx.currentTime + 0.02 + k * 0.04, 0.04 + 0.18 * k / n, 0.04, 1200);
  }

  // A few quick notes, `gap` seconds apart, the last one held for `hold` seconds: stings and fanfares.
  function notes(list, gap, hold, peak = 0.1) {
    if (!ctx || !timer) return;
    const t = ctx.currentTime + 0.07;
    list.forEach((n, k) => tone("square", n, t + k * gap, k === list.length - 1 ? hold : 0.3, peak, bus.lead, 0.005));
  }

  // A tone that slides upward for `seconds`: the tension before an ace takes a king.
  function riser(seconds) {
    if (!ctx || !timer) return;
    const t = ctx.currentTime + 0.02, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(880, t + seconds);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + seconds);
    g.gain.exponentialRampToValueAtTime(0.0001, t + seconds + 0.05);
    o.connect(g); g.connect(bus.lead);
    o.start(t); o.stop(t + seconds + 0.1);
  }

  // The deciding card lands: a deep boom and a long crash. `sting` adds a quick rising flourish for a close call.
  function impact(sting = false) {
    if (!ctx || !timer) return;
    const t = ctx.currentTime + 0.02;
    if (sting) notes([76, 81, 88], 0.07, 0.3);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.5);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(bus.out);
    o.start(t); o.stop(t + 0.75);
    hit(t, 0.35, 0.9, 2500);
  }

  // Card sounds (shuffling, dealing): `count` soft ticks, `gap` seconds apart, starting in `delay` seconds.
  // They play through their own output so they can be cut short with hush().
  let sfx = null;
  function ticks(delay, count, gap, peak) {
    if (!ctx || !timer) return;
    if (!sfx) { sfx = ctx.createGain(); sfx.connect(master); }
    for (let k = 0; k < count; k++) hit(ctx.currentTime + delay + k * gap, peak, 0.025, 3500, sfx);
  }
  function hush() {
    if (sfx) sfx.disconnect();
    sfx = null;
  }

  // Each section: how long one step lasts, how many steps before it loops, its loudness, and what a step plays.
  const SECTIONS = {
    march:   { step: STEP,          steps: 128,      level: 1,   play: marchStep },
    duel:    { step: DUEL_STEP,     steps: 64,       level: 0.6, play: duelStep },
    roll:    { step: DUEL_STEP / 2, steps: Infinity, level: 0.6, play: rollStep },
    victory: { step: WIN_STEP,      steps: 128,      level: 0.6, play: victoryStep },
  };

  // Queue the notes for the next fraction of a second; called many times a second.
  function tick() {
    if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.05;
    while (nextTime < ctx.currentTime + 0.2) {
      const section = SECTIONS[mode];
      section.play(pos, nextTime);
      nextTime += section.step;
      pos = (pos + 1) % section.steps;
    }
  }

  function start() {
    if (!ctx) build();
    ctx.resume();
    if (!timer) { timer = setInterval(tick, 50); tick(); }
  }

  function stop() {
    clearInterval(timer); timer = null;
    if (ctx) ctx.suspend();
  }

  // Browsers only allow sound after the first click or key press on the page.
  const unlock = () => { if (on) start(); };
  addEventListener("pointerdown", unlock, { once: true });
  addEventListener("keydown", unlock, { once: true });
  document.addEventListener("visibilitychange", () => {
    if (!ctx || !timer) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    get on() { return on; },
    get volume() { return volume; },
    setOn(value) { on = value; save("war-music", on ? "on" : "off"); if (on) start(); else stop(); },
    setVolume(value) {
      volume = value; save("war-volume", String(value));
      if (ctx) master.gain.setTargetAtTime(value * GAIN, ctx.currentTime, 0.02);
    },
    get mode() { return mode; },
    section(name) { setMode(name); },                      // "march", "duel", "roll" or "victory"
    impact, swell, riser, ticks, hush,
    fanfare() { notes([72, 76, 79, 84], 0.08, 0.7); },     // an ace takes a king: a rising major chord
    chime() { notes([88, 93], 0.09, 0.5, 0.07); },         // the crown lands
  };
})();

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
const NAMES = ["Player 1", "Player 2"];
const TIMINGS = {                       // hold: cards stay on the table; fly: travel time to the pile;
  slow:    { hold: 900, fly: 600, tense: 800, banner: 1500 },   // tense: build-up before a close call;
  normal:  { hold: 450, fly: 400, tense: 600, banner: 1200 },   // banner: how long the close call is shown
  fast:    { hold: 90,  fly: 160, tense: 0,   banner: 450 },
  instant: { hold: 90,  fly: 160, tense: 0,   banner: 450 },    // used only for single manual rounds
};
const SUSPENSE = 400;                   // pause before the deciding duel cards appear
const REVEAL = 1480;                    // length of the deciding cards' flip animation (matches the CSS)
const DUEL_RESULT = 2200;               // how long the duel popup shows the winner before closing
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let game;
let shown;            // pile sizes drawn on screen; lags the game while a round is being shown
let active = null;    // round being shown, see step(): { r, duel, lead, half, put, need, downs,
                      //                                 waiting, flipping, tense, resolved }
let timers = [];      // timeouts belonging to the round being shown
let autoOn = false, autoTimer = null;
let dealing = false;  // the shuffle-and-deal animation at the start of a game is running
let net = null;       // online session, see "Online play" below; null when playing solo
let pumping = false;  // the opponent's presses are being played right now (see pump)
const online = () => !!(net && net.live);

// Draw 3 mode. Picks are kept in `book` under "round:duel:seat" (index in that hand) until the round
// they belong to can be played. A round is only played for real once every pick it needs is in;
// until then the screen shows a look-ahead copy (see advance). Nobody sees a pick before both are in.
let book = {};
let pickState = null; // the picks being waited for: { no, d, needs: [bool, bool], chosen: [index or undefined] }
let shownHands = [[], []];                 // hands drawn on screen; lag the game like `shown`
const draw3 = () => !!(game && game.mode === "draw3");
const humanSeat = () => (online() ? net.me : 0);
const pickKey = (no, d, i) => `${no}:${d}:${i}`;
const canPick = () => !!(draw3() && pickState && !dealing && pickState.needs[humanSeat()] &&
                         pickState.chosen[humanSeat()] === undefined);

function picksFor(no) {
  return [0, 1].map((i) => {
    const list = [];
    for (let d = 0; d < 60; d++) if (book[pickKey(no, d, i)] !== undefined) list[d] = book[pickKey(no, d, i)];
    return list;
  });
}

// Play the current round as far as the picks so far allow. Once nothing is missing it is played on
// the real game; until then on a copy, which shows how far the round has got.
function advance() {
  const picks = picksFor(game.round + 1);
  const ahead = playRound(structuredClone(game), picks);
  return ahead.pending === undefined ? playRound(game, picks) : ahead;
}

// Move a Draw 3 round on once the picks it waits for are in. Called whenever that may have happened:
// a pick made or received, a round finished, a duel reaching its deciding card. The computer picks
// for Player 2 in solo play, and for you too while auto-play is on (or when `forceMe`: Next pressed).
function tryProceed(forceMe = false) {
  if (!draw3() || dealing) return;
  let no, d;
  if (!active) {
    if (game.over) { pickState = null; renderHands(); updateControls(); return; }
    no = game.round + 1; d = 0;
  } else if (active.picking) {
    no = active.r.round; d = active.duel;
  } else return;
  const auto = (i) => !online() && (i === 1 || autoOn || forceMe);
  let ahead;
  for (;;) {
    ahead = playRound(structuredClone(game), picksFor(no));
    if (ahead.pending !== d) break;
    const due = [0, 1].filter((i) => ahead.choosing[i] && book[pickKey(no, d, i)] === undefined && auto(i));
    if (!due.length) break;
    for (const i of due) book[pickKey(no, d, i)] = cpuChoose(ahead.hands[i], d);
  }
  const chosen = [0, 1].map((i) => book[pickKey(no, d, i)]);
  if (ahead.pending === d) {                         // still waiting on you or your opponent
    pickState = { no, d, needs: ahead.choosing, chosen };
    if (active) $("duelText").textContent = canPick()
      ? "Pick your deciding card."
      : "Waiting for your opponent to pick their deciding card…";
    renderHands(); updateControls();
    return;
  }
  // Solo: a round where you had nothing to choose waits for Next round rather than starting by itself.
  if (!active && !online() && !autoOn && !forceMe && chosen[0] === undefined) {
    pickState = { no, d, needs: [false, false], chosen };
    renderHands(); updateControls();
    return;
  }
  pickState = null;
  if (!active) { step(); return; }
  active.picking = false;
  active.r = advance();
  flipDuel();
}

// You clicked card `k` in your hand.
function humanPick(k) {
  if (!canPick()) return;
  const { no, d } = pickState, me = humanSeat();
  book[pickKey(no, d, me)] = k;
  if (online()) send({ t: "pick", g: net.gameNo, n: no, d, k });
  tryProceed();
}

// Draw both hands from `shownHands`: yours face up, the other face down. A picked card is lifted.
function renderHands() {
  const on3 = draw3(), me = humanSeat(), can = canPick(), ps = pickState;
  for (const i of [0, 1]) {
    const box = $("p" + i).querySelector(".hand");
    box.hidden = !on3;
    if (!on3) continue;
    const mine = i === me, chosen = ps ? ps.chosen[i] : undefined;
    const label = box.firstElementChild;
    label.textContent = mine
      ? (can ? (ps.d ? "Your hand · pick your deciding card" : "Your hand · pick a card")
             : chosen !== undefined && ps.needs[1 - i] && ps.chosen[1 - i] === undefined ? "Your hand · waiting for your opponent…"
             : "Your hand")
      : (online() ? "Opponent's hand" : "Computer's hand") + (chosen !== undefined ? " · picked" : "");
    label.className = mine && can ? "go" : "";
    box.lastElementChild.replaceChildren(...shownHands[i].map((card, k) => handCard(card, k, mine, can, k === chosen)));
  }
  const inDuel = on3 && active && active.picking && ps && ps.needs[me];
  $("duelHand").hidden = !inDuel;
  if (inDuel) {
    const chosen = ps.chosen[me];
    $("duelHand").lastElementChild.replaceChildren(...shownHands[me].map((card, k) => handCard(card, k, true, can, k === chosen)));
  }
}

function handCard(card, k, mine, can, chosen) {
  if (!mine) {
    const el = document.createElement("div");
    el.className = "card down" + (chosen ? " chosen" : "");
    return el;
  }
  const el = document.createElement("button"), red = card.suit === "♥" || card.suit === "♦";
  el.className = "card pick" + (red ? " red" : "") + (chosen ? " chosen" : "");
  el.innerHTML = `<span>${rankLabel(card.rank)}</span><span>${card.suit}</span>`;
  el.setAttribute("aria-label", `Play ${rankWord(card.rank)} of ${card.suit}`);
  el.disabled = !can;
  el.onclick = () => humanPick(k);
  return el;
}

// Music that should be playing outside a duel: the fanfare once a player has won, otherwise the march.
const baseSection = () =>
  game && game.over && game.winner !== null && (!active || active.resolved) ? "victory" : "march";

const capValue = () => Math.max(1, parseInt($("cap").value, 10) || 1);
const timings = () => TIMINGS[online() ? "normal" : $("speed").value];
const realCounts = () => game.players.map((p) => ({ draw: p.draw.length, won: p.won.length, refills: p.refills }));
const stackEl = (i, kind) => $("p" + i).querySelector(`.stack[data-kind=${kind}]`);
const laidEl = (i) => $("p" + i).querySelector(".laid");
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const part = (r, i, duel, up) => r.laid[i].filter((e) => e.duel === duel && e.up === up);

function rankName(rank) {
  return { 8: "an 8", 11: "a jack", 12: "a queen", 13: "a king", 14: "an ace" }[rank] || "a " + rank;
}

const rankWord = (rank) => ({ 11: "Jack", 12: "Queen", 13: "King", 14: "Ace" }[rank] || String(rank));
const beats = (r) => `${rankWord(r.up[r.winner].rank)} beats ${rankWord(r.up[1 - r.winner].rank)}`;

// Restart a CSS animation that is tied to a class.
function replay(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
const pulse = (el) => replay(el, "pulse");

const DUEL_TITLES = ["DUEL!", "DOUBLE DUEL!", "TRIPLE DUEL!!", "QUADRUPLE DUEL!!!"];
const duelTitle = (d) => DUEL_TITLES[d - 1] || `${d}× DUEL!!!`;

function setTitle(text, animation) {
  const title = $("duelTitle");
  title.textContent = text;
  title.className = "";
  void title.offsetWidth;
  title.className = animation;
}

// Draw both piles of both players from `shown`. A pile looks thicker the more cards it holds.
function drawPiles() {
  for (const i of [0, 1]) {
    for (const kind of ["draw", "won"]) {
      const el = stackEl(i, kind), n = shown[i][kind];
      el.classList.toggle("empty", n === 0);
      el.innerHTML = `<span>${n}</span>`;
      const layers = [];
      for (let k = 1; k <= Math.floor(n / 3); k++)
        layers.push(`${k}px ${k}px 0 ${k % 2 ? "#1e3a8a" : "#dbeafe"}`);
      el.style.boxShadow = layers.join(",") || "none";
    }
    $("p" + i).querySelector(".info").textContent =
      `Pass ${Math.min(shown[i].refills + 1, game.cap)} of ${game.cap} · ` +
      `${shown[i].draw + shown[i].won + (draw3() ? shownHands[i].length : 0)} cards`;
  }
}

function cardEl(entry, deal = true) {
  const el = document.createElement("div");
  const slide = deal ? " deal" : "";
  if (!entry.up) { el.className = "card down" + slide; return el; }
  const red = entry.card.suit === "♥" || entry.card.suit === "♦";
  el.className = "card" + slide + (red ? " red" : "");
  el.innerHTML = `<span>${rankLabel(entry.card.rank)}</span><span>${entry.card.suit}</span>`;
  return el;
}

// A two-sided card for the duel popup: it arrives face down and turns over (see the .flip styles).
function flipEl(entry) {
  const flip = document.createElement("div"), wrap = document.createElement("div"), inner = document.createElement("div");
  flip.className = "flip"; wrap.className = "wrap"; inner.className = "inner";
  inner.append(cardEl({ up: false }, false), cardEl(entry, false));
  wrap.append(inner);
  flip.append(wrap);
  return flip;
}

// Sparks flying out of the winning card. `layer` is the box they are drawn in:
// the one inside the duel popup, or #tableSparks over the table.
function burst(el, layer = $("sparks")) {
  const box = layer.getBoundingClientRect(), c = el.getBoundingClientRect();
  const x = c.left + c.width / 2 - box.left;
  const y = c.top + c.height / 2 - box.top;
  const colors = ["#facc15", "#ffffff", "#f87171"];
  for (let k = 0; k < 18; k++) {
    const spark = document.createElement("div");
    const angle = (k / 18) * 2 * Math.PI + Math.random() * 0.3, reach = 60 + Math.random() * 80;
    spark.className = "spark";
    spark.style.cssText = `left:${x}px; top:${y}px; background:${colors[k % 3]}; ` +
      `--dx:${Math.cos(angle) * reach}px; --dy:${Math.sin(angle) * reach}px`;
    layer.append(spark);
  }
}

// Move one card from a player's piles on screen to the table (mirrors drawCard).
function place(i, entry, inPopup = true) {
  const s = shown[i];
  if (entry.fromHand) {                                    // Draw 3: the card leaves the hand, not the pile
    const h = shownHands[i], k = h.findIndex((c) => c.rank === entry.card.rank && c.suit === entry.card.suit);
    if (k >= 0) h.splice(k, 1);
    renderHands();
  } else {
    if (s.draw === 0) { s.draw = s.won; s.won = 0; s.refills++; pulse(stackEl(i, "draw")); }
    s.draw--;
  }
  laidEl(i).append(cardEl(entry));
  if (inPopup && $("duel").open) {                         // the duel popup shows the same cards
    $("d" + i).append(cardEl(entry));
    $("duel").scrollTop = $("duel").scrollHeight;          // keep the newest cards in view
  }
}

// --- Duel popup: covers the table while a duel is played, and switches the music ---

function openDuel(r, d, tied, downs) {
  const dlg = $("duel");
  if (!dlg.open) {
    for (const i of [0, 1])
      $("d" + i).replaceChildren(...r.laid[i].filter((e) => e.duel < d).map((e) => cardEl(e)));
    dlg.showModal();
  }
  setTitle(duelTitle(d), "shake");
  $("duelText").textContent = `Both players flipped ${rankName(tied)}. ` +
    (downs ? `${online() ? "Take turns to place" : "Place"} ${downs} card${downs > 1 ? "s" : ""} face down, ` +
             (draw3() ? "then pick your deciding card." : "then the next card decides.")
           : "The next card decides.");
  music.section("duel");
}

function closeDuel() {
  if ($("duel").open) $("duel").close();
  $("duel").classList.remove("impact", "jolt");
  $("sparks").replaceChildren();
  music.section(baseSection());
}

function setStatus(text, duel = false) {
  $("status").textContent = text;
  $("status").classList.toggle("duel", duel);
}

function resultText(r) {
  let text = r.winner === null
    ? `Round ${r.round}: tie with no cards left to duel.`
    : `Round ${r.round}: ${NAMES[r.winner]} takes ${r.potSize} cards` +
      (r.duels ? ` after ${r.duels} duel${r.duels > 1 ? "s" : ""}.` : ".");
  if (r.close) text += ` Close call: ${rankName(r.up[r.winner].rank)} beat ${rankName(r.up[1 - r.winner].rank)}.`;
  r.lastCardStands.forEach((s, i) => {
    if (s) text += ` ${NAMES[i]} ran out, so their last card stood.`;
  });
  if (game.over) {
    const who = game.winner === null ? "It's a draw" : `${NAMES[game.winner]} wins`;
    const why = { cards: "the other player is out of cards",
                  cap: `a player finished deck pass ${game.cap}, so the most cards wins`,
                  stalemate: "both players ran out during a duel" }[game.reason];
    text += ` Game over: ${who} (${why}).`;
  }
  return text;
}

function updateControls() {
  const a = active, on = online();
  const over = game.over && (!a || a.resolved);    // don't give the ending away mid-duel
  const turn = on ? turnSeat() : null;             // online: the player whose press the game is waiting for
  const theirs = turn !== null && turn !== net.me;
  const duelCard = () => {                         // online this counts your own cards, solo the presses
    if (on) return `Place duel card ${a.put[net.me] + 1} of ${a.need[net.me]}`;
    const left = Math.max(a.need[0] - a.put[0], a.need[1] - a.put[1]);
    return `Place duel card ${a.downs - left + 1} of ${a.downs}`;
  };
  const d3 = draw3(), ps = pickState, idle = !a || a.resolved;
  const label = dealing ? "Skip shuffle"
              : a && a.tense ? "So close…"
              : a && a.picking ? (canPick() ? "Pick your deciding card" : "Waiting for opponent…")
              : a && a.flipping ? "Flipping…"
              : theirs ? "Opponent's turn…"
              : a && a.waiting ? duelCard()
              : d3 && idle && !over && !on ? (ps && ps.needs[0] ? "Play a random card" : "Next round")
              : d3 && idle && !over && net.started ? (canPick() ? "Pick a card to play" : "Waiting for opponent…")
              : !on ? "Next round"
              : over ? "Game over"
              : net.started ? "Play your card" : "Waiting for the host…";
  $("next").disabled = over || theirs || (on && !net.started) || !!(a && a.picking) ||
                       (d3 && on && !(a && a.waiting));
  $("next").textContent = label;
  $("next").classList.toggle("duel", !!a && a.duel > 0 && !a.resolved);
  $("duelBtn").textContent = label;
  $("duelBtn").disabled = !(a && a.waiting) || theirs;
  $("duelBtn").hidden = !a || a.resolved;
  $("auto").disabled = over || dealing;
  $("auto").textContent = autoOn ? "Pause" : "Auto-play";
  $("new").disabled = on && !over;                 // online: no restarting in the middle of a game
  $("cap").disabled = on && (net.me === 1 || !over);   // online: the host sets it, between games
  $("mode").disabled = $("cap").disabled;
  for (const i of [0, 1]) {
    const mine = on && i === net.me;
    const seat = `Player ${i + 1}` + (on ? (mine ? " (you)" : " (opponent)")
                                         : d3 ? (i === 0 ? " (you)" : " (computer)") : "");
    const badge = $("p" + i).querySelector(".badge");
    $("p" + i).classList.toggle("winner", over && game.winner === i);
    $("p" + i).querySelector(".who").textContent = seat;
    badge.hidden = turn !== i;
    badge.textContent = mine ? "Your turn" : "Their turn";
    badge.classList.toggle("theirs", !mine);
    $("dn" + i).textContent = seat + (turn !== i ? "" : mine ? " · your turn" : " · their turn");
  }
  if (on && turn === net.me) {                     // keep the keyboard on the button it is your turn to press
    const btn = $("duel").open ? $("duelBtn") : $("next"), at = document.activeElement;
    if (at === document.body || at === $("next") || at === $("duelBtn")) btn.focus({ preventScroll: true });
  }
}

// --- Showing a round: opening flip, then each duel one button press at a time, then the pot flies ---

// Start a round. Solo, both players flip at once. Online they take turns: `seat` plays first,
// and the other player's card is only shown once they press (see follow).
// `active` describes the round on screen:
//   lead: who played first            half: only the first card of the opening flip is down so far
//   duel: the duel being played (0 = none yet)
//   need / put: face-down cards each player must place in this duel, and has placed; downs: the larger `need`
//   waiting: a face-down card is due   flipping: the deciding cards are turning over
//   tense: a close call is building    resolved: the winner is showing
function step(seat = null) {
  if (active) settle();                  // skip the rest of a round still being shown
  if (game.over) return;
  if (!online()) game.cap = capValue();  // online, the cap is fixed when the host deals
  const r = draw3() ? advance() : playRound(game), first = seat === null ? 0 : seat;
  active = { r, duel: 0, lead: first, half: true, put: [0, 0], need: [0, 0], downs: 0,
             waiting: false, flipping: false, picking: false, tense: false, resolved: false };
  for (const i of [0, 1]) laidEl(i).replaceChildren();
  place(first, r.laid[first][0]);
  if (seat === null) { follow(); return; }
  drawPiles();
  const mine = seat === net.me;
  setStatus(`Round ${r.round}: ${mine ? "You" : "Your opponent"} played ${rankName(r.laid[seat][0].card.rank)}. ` +
            (mine ? "Waiting for your opponent…" : "Your turn."));
  updateControls();
}

// The second card of the opening flip goes down, and the round carries on from there.
function follow() {
  const a = active, r = a.r, i = 1 - a.lead;
  a.half = false;
  place(i, r.laid[i][0]);
  drawPiles();
  if (r.duels > 0) beginDuel(1); else resolve();
}

function beginDuel(d) {
  const a = active, r = a.r;
  a.duel = d; a.put = [0, 0];
  a.need = [0, 1].map((i) => part(r, i, d, false).length);
  a.downs = Math.max(...a.need);
  const tied = r.laid[0].filter((e) => e.up && e.duel < d).pop().card.rank;
  a.waiting = a.downs > 0;
  a.flipping = !a.waiting;               // nobody has a card to place face down: go straight to the flip
  openDuel(r, d, tied, a.downs);
  setStatus(`Round ${r.round}: ${duelTitle(d)} Both players flipped ${rankName(tied)}.`, true);
  if (a.flipping) later(toFlip, SUSPENSE);
  updateControls();
  $("duelBtn").focus({ preventScroll: true });
  $("duel").scrollTop = 0;
  pump();                                // online: the opponent may already have placed their first card
}

// One button press. Solo, each player places their next face-down card; online, only `seat` does.
function advanceDuel(seat = null) {
  const a = active, r = a.r;
  for (const i of [0, 1]) {
    if (seat !== null && seat !== i) continue;
    const entry = part(r, i, a.duel, false)[a.put[i]];
    if (entry) { place(i, entry); a.put[i]++; }    // a player short on cards places fewer
  }
  drawPiles();
  if (a.put[0] >= a.need[0] && a.put[1] >= a.need[1]) {
    a.waiting = false; a.flipping = true;
    later(toFlip, SUSPENSE);
  }
  updateControls();
}

// The face-down cards are down. Draw 3: if the deciding cards still have to be picked, wait for that
// (see tryProceed, which flips them once both picks are in); otherwise flip them now.
function toFlip() {
  const a = active;
  if (a.r.pending === a.duel) { a.flipping = false; a.picking = true; tryProceed(); updateControls(); }
  else flipDuel();
}

// The deciding cards. In the popup they rise face down over a drum roll, tremble,
// turn over and slam down; only then does the result (or the next duel) appear.
function flipDuel() {
  const a = active, r = a.r, d = a.duel;
  const ups = [0, 1].map((i) => part(r, i, d, true));
  const dramatic = $("duel").open && !reduceMotion;
  if (dramatic) {
    for (const i of [0, 1]) $("d" + i).append(...ups[i].map(flipEl));
    $("duel").scrollTop = $("duel").scrollHeight;
    music.section("roll");
  }
  later(() => {
    a.flipping = false;
    for (const i of [0, 1]) ups[i].forEach((entry) => place(i, entry, !dramatic));
    drawPiles();
    if (dramatic) replay($("duel"), "impact");             // flash and shake as the cards land
    if (d < r.duels) beginDuel(d + 1); else resolve();
  }, dramatic ? REVEAL : 0);
}

// Every card of the round is on the table. A close call (won by a single rank) is held back
// for a moment first, while both cards strain against each other over a drum roll.
function resolve() {
  const a = active, r = a.r, { tense } = timings();
  if (!r.close || reduceMotion || !tense || $("duel").open) { announce(); return; }
  const wait = tense + (r.kingslayer ? 500 : 0);   // an ace against a king builds up for longer, in the dark
  a.tense = true;
  for (const i of [0, 1]) laidEl(i).lastElementChild.classList.add("tense");
  if (r.kingslayer) {
    for (const i of [0, 1]) laidEl(i).lastElementChild.classList.add("royal");
    $("dim").classList.add("on");
    music.riser(wait / 1000);
  }
  setStatus(`Round ${r.round}: ${rankName(r.up[0].rank)} against ${rankName(r.up[1].rank)}…`);
  music.swell(wait / 1000);
  updateControls();
  later(announce, wait);
}

// The round's winner is now visible on the table.
function announce() {
  const a = active, r = a.r, w = r.winner, t = timings();
  const drama = r.close && !reduceMotion;
  a.tense = false; a.resolved = true;
  if (w !== null) laidEl(w).lastElementChild.classList.add("best");
  setStatus(resultText(r));
  updateControls();
  const finish = (extra = 0) => {
    if (w === null || reduceMotion) {            // no flight: leave the cards on the table
      settle(false);
      afterRound(t.hold + 200);
    } else {
      later(() => collect(r, () => { settle(); afterRound(60); }), t.hold + extra);
    }
  };
  if (!$("duel").open) {
    music.section(baseSection());
    finish(drama ? closeCall(r, t) : 0);
    return;
  }
  // Show who won the duel in the popup for a moment, then close it and carry on.
  music.section("duel");
  if (w === null) {
    setTitle("NO WINNER", "slam");
    $("duelText").textContent = "Nobody has cards left to continue.";
  } else {
    const best = $("d" + w).lastElementChild;
    best.classList.add("win");                             // winning card glows and grows
    $("d" + (1 - w)).lastElementChild.classList.add("lose");   // losing card fades and drops
    setTitle(`${NAMES[w].toUpperCase()} WINS!`, "slam");
    $("duelText").textContent = `${NAMES[w]} wins the duel and takes all ${r.potSize} cards.`;
    music.impact();
    if (!reduceMotion) burst(best);
    if (drama) later(() => {                               // a beat later the close call lands as a second blow
      const call = document.createElement("strong");
      call.className = r.kingslayer ? "call royal" : "call";
      call.textContent = r.kingslayer ? "KINGSLAYER!" : "CLOSE CALL!";
      $("duelText").replaceChildren(call, ` ${beats(r)}. ${NAMES[w]} takes all ${r.potSize} cards.`);
      replay($("duel"), "jolt");
      burst(best);
      music.impact(!r.kingslayer);
      if (r.kingslayer) { best.append(crownEl()); music.fanfare(); }   // the crown drops onto the ace
    }, 600);
  }
  later(() => { closeDuel(); finish(); }, DUEL_RESULT + (drama ? 800 : 0));
}

// A close call on the table: the winning card lunges, the loser recoils, and a banner slams down
// between them. An ace beating a king gets a scene of its own instead (see strikeKing).
// Returns how long the scene stays on screen before the cards are collected.
function closeCall(r, t) {
  const win = laidEl(r.winner).lastElementChild, lose = laidEl(1 - r.winner).lastElementChild;
  const royal = r.kingslayer;
  $("banner").firstElementChild.textContent = royal ? "KINGSLAYER!" : "CLOSE CALL!";
  $("banner").lastElementChild.textContent = beats(r);
  $("banner").classList.toggle("royal", royal);
  $("tableSparks").replaceChildren();
  if (royal && t.tense) { strikeKing(win, lose); return t.banner + CROWNING; }
  win.classList.remove("tense");
  lose.classList.remove("tense");
  win.classList.add("win", "clash");
  lose.classList.add("lose", "clash");
  slam(win, royal);
  return t.banner;
}

// The moment of impact: the banner slams down, sparks fly out of `el` and the table shakes.
function slam(el, royal) {
  $("banner").hidden = false;
  replay($("banner"), "show");
  burst(el, $("tableSparks"));
  replay(document.querySelector("main"), "jolt");
  music.impact(!royal);
  if (royal) music.fanfare();
}

// An ace beats a king. The ace spins across the table and strikes the king, which is slashed and
// knocked into a spin. Once the ace is back in its place, the king's crown floats over and lands on it.
const STRIKE = 900, STRIKE_HIT = 380;    // the ace's flight there and back, and when its blow lands (match the CSS)
const CROWN_FLY = 650;                   // the crown's trip from the king to the ace
const CROWNING = 1300;                   // extra time on screen so the whole scene can play out

function strikeKing(ace, king) {
  const a = ace.getBoundingClientRect(), k = king.getBoundingClientRect();
  const dx = k.left + k.width / 2 - (a.left + a.width / 2), dy = k.top + k.height / 2 - (a.top + a.height / 2);
  const reach = Math.hypot(dx, dy) || 1;
  ace.classList.remove("tense");
  ace.style.setProperty("--dx", `${dx}px`);
  ace.style.setProperty("--dy", `${dy}px`);
  ace.classList.add("royal", "win", "strike");
  later(() => {                                            // the blow lands
    const layer = $("tableSparks"), box = layer.getBoundingClientRect(), ring = document.createElement("div");
    king.classList.remove("tense");
    king.style.setProperty("--kx", `${dx / reach * 46}px`);   // knocked on along the ace's path
    king.style.setProperty("--ky", `${dy / reach * 46}px`);
    king.classList.add("royal", "slain");
    $("dim").classList.remove("on");
    replay($("dim"), "flash");
    ring.className = "ring";
    ring.style.cssText = `left:${k.left + k.width / 2 - box.left}px; top:${k.top + k.height / 2 - box.top}px`;
    slam(king, true);
    layer.append(ring);
  }, STRIKE_HIT);
  later(() => {                                            // the ace is home again: the crown changes hands
    const crown = crownEl();
    ace.append(crown);
    const c = crown.getBoundingClientRect();
    const cx = k.left + k.width / 2 - (c.left + c.width / 2), cy = k.top + k.height / 2 - (c.top + c.height / 2);
    crown.animate([
      { transform: `translate(${cx}px, ${cy}px) scale(.4) rotate(-50deg)`, opacity: 0 },
      { transform: `translate(${cx / 2}px, ${cy / 2 - 60}px) scale(1.8) rotate(25deg)`, opacity: 1 },
      { transform: "none", opacity: 1 },
    ], { duration: CROWN_FLY, easing: "ease-in-out" });
    later(() => { burst(crown, $("tableSparks")); music.chime(); }, CROWN_FLY);
  }, STRIKE + 40);
}

function crownEl() {
  const el = document.createElement("span");
  el.className = "crown";
  el.textContent = "👑";
  return el;
}

function clearCloseCall() {
  $("banner").hidden = true;
  $("tableSparks").replaceChildren();
  $("dim").classList.remove("on", "flash");
}

// Fly every card on the table into the winner's won pile, which grows as each one lands.
function collect(r, done) {
  const w = r.winner, target = stackEl(w, "won");
  const cards = [...laidEl(w).children, ...laidEl(1 - w).children];  // winner's cards land first
  const { fly } = timings();
  const stagger = Math.min(fly * 0.15, 600 / cards.length);
  cards.forEach((el) => el.classList.remove("deal", "tense", "clash"));
  const t = target.getBoundingClientRect();
  cards.forEach((el, k) => {
    const b = el.getBoundingClientRect();
    const dx = t.left + t.width / 2 - (b.left + b.width / 2);
    const dy = t.top + t.height / 2 - (b.top + b.height / 2);
    el.style.zIndex = 10;
    el.style.transition = `transform ${fly}ms ease-in ${k * stagger}ms`;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(.85)`;
    later(() => {
      el.style.visibility = "hidden";
      shown[w].won++;
      drawPiles();
      pulse(target);
    }, fly + k * stagger);
  });
  later(done, fly + (cards.length - 1) * stagger + 40);
}

// End the round being shown: log it and make the screen match the real game state.
function settle(clearTable = true) {
  timers.forEach(clearTimeout);
  timers = [];
  if (active && active.r.pending === undefined) logRound(active.r);   // a half-picked round was never played
  active = null;
  closeDuel();
  clearCloseCall();
  if (clearTable) for (const i of [0, 1]) laidEl(i).replaceChildren();
  shown = realCounts();
  syncHands();
  drawPiles();
  updateControls();
}

function syncHands() {
  shownHands = game.players.map((p) => p.hand.map((c) => ({ ...c })));
  renderHands();
}

const autoNext = () => (draw3() ? tryProceed() : step());

function afterRound(delay) {
  if (autoOn) {
    if (game.over) autoOn = false;
    else autoTimer = setTimeout(autoNext, delay);
  }
  updateControls();
  pump();                                // online: the opponent may already have played their next card
  if (!autoOn) tryProceed();             // Draw 3: the computer picks, or both picks are already in
}

function logRound(r) {
  const faces = (i) => r.laid[i].filter((x) => x.up).map((x) => rankLabel(x.card.rank) + x.card.suit).join(" → ");
  const line = document.createElement("div");
  line.textContent = `#${r.round}  P1 ${faces(0)}  |  P2 ${faces(1)}  —  ` +
    (r.winner === null ? "tie" : `${NAMES[r.winner]} +${r.potSize}`) +
    (r.kingslayer ? " · kingslayer" : r.close ? " · close call" : "");
  $("log").prepend(line);
  while ($("log").childElementCount > 200) $("log").lastChild.remove();
}

function stopAuto() {
  const was = autoOn;
  autoOn = false;
  clearTimeout(autoTimer);
  updateControls();
  if (was) tryProceed();                 // Draw 3: hand the next pick back to you
}

function startAuto() {
  if ($("speed").value === "instant") {  // run to the end in one go: no animation, no duel presses
    if (active) settle();
    game.cap = capValue();
    let r = null;
    pickState = null;
    while (!game.over) { r = draw3() ? cpuRound(game) : playRound(game); logRound(r); }
    if (r) {
      for (const i of [0, 1]) laidEl(i).replaceChildren(...r.laid[i].map((e) => cardEl(e)));
      if (r.winner !== null) laidEl(r.winner).lastElementChild.classList.add("best");
      setStatus(resultText(r));
    }
    shown = realCounts();
    syncHands();
    drawPiles();
    updateControls();
    music.section(baseSection());
    return;
  }
  autoOn = true;
  if (active) {                          // carries on by itself once this round is finished
    updateControls();
    if (active.picking) tryProceed();    // Draw 3: a duel waiting for your pick gets one
  } else autoNext();
}

function start(deck) {
  autoOn = false;
  clearTimeout(autoTimer);
  timers.forEach(clearTimeout);
  timers = [];
  active = null;
  book = {};
  pickState = null;
  shownHands = [[], []];
  game = newGame(capValue(), deck, $("mode").value === "draw3" ? "draw3" : "classic");
  renderHands();
  if (net) Object.assign(net, { point: 0, remotePoint: -1, started: online() });
  closeDuel();                           // also puts the music back on the march
  clearCloseCall();
  for (const i of [0, 1]) laidEl(i).replaceChildren();
  $("log").replaceChildren();
  shuffleAndDeal();
}

// --- Start of a game: the deck is riffle-shuffled in the middle, then dealt out card by card ---

const RIFFLE = 560, RIFFLES = 3;         // length of one riffle in ms, and how many
const DEAL_GAP = 24, DEAL_FLY = 240;     // ms between dealt cards, and each card's travel time

function shuffleAndDeal() {
  music.hush();
  $("dealer").replaceChildren();
  if (reduceMotion) { finishDeal(); return; }
  dealing = true;
  shown = [0, 1].map(() => ({ draw: 0, won: 0, refills: 0 }));
  drawPiles();
  setStatus("");
  updateControls();

  // The deck sits over the status line, between the two players (#dealer is anchored to its centre).
  const backCard = (lift) => {
    const el = document.createElement("div");
    el.className = "card down";
    el.style.cssText = `position:absolute; left:-26px; top:${-38 - lift}px`;
    $("dealer").append(el);
    return el;
  };
  const deck = [];
  for (let k = 0; k < 12; k++) deck.push(backCard(k * 0.7));

  // Riffle: the deck splits into two halves, then the cards drop back together one by one.
  deck.forEach((el, k) => {
    const side = k % 2 ? 1 : -1, back = 0.42 + (k / deck.length) * 0.4;
    const apart = `translate(${side * 44}px, 0) rotate(${side * 7}deg)`;
    el.animate([
      { offset: 0, transform: "none" },
      { offset: 0.28, transform: apart },
      { offset: back, transform: apart },
      { offset: back + 0.14, transform: "none" },
      { offset: 1, transform: "none" },
    ], { duration: RIFFLE, iterations: RIFFLES, easing: "ease-in-out" });
  });
  for (let n = 0; n < RIFFLES; n++)
    music.ticks((n + 0.42) * RIFFLE / 1000, 14, 0.4 * RIFFLE / 14 / 1000, 0.05);

  // Deal: cards fly alternately to each player's draw pile, which grows as they land.
  later(() => {
    music.ticks(0, 52, DEAL_GAP / 1000, 0.03);
    for (let n = 0; n < 52; n++) {
      const i = n % 2;
      later(() => {
        const el = backCard(0);
        const from = $("dealer").getBoundingClientRect(), to = stackEl(i, "draw").getBoundingClientRect();
        const flight = `translate(${to.left + to.width / 2 - from.left}px, ${to.top + to.height / 2 - from.top}px) scale(.85)`;
        el.animate([{ transform: "none" }, { transform: flight }], { duration: DEAL_FLY, easing: "ease-in" });
        later(() => { el.remove(); shown[i].draw++; drawPiles(); }, DEAL_FLY - 10);
        if (n % 5 === 4 && deck.length) deck.pop().remove();   // the deck thins as it is dealt
      }, n * DEAL_GAP);
    }
    later(finishDeal, 51 * DEAL_GAP + DEAL_FLY + 60);
  }, RIFFLE * RIFFLES + 150);
}

// The game is ready to play (also used to skip the shuffle).
function finishDeal() {
  dealing = false;
  timers.forEach(clearTimeout);
  timers = [];
  music.hush();
  $("dealer").replaceChildren();
  shown = realCounts();
  syncHands();
  drawPiles();
  setStatus(draw3()
          ? "Pick a card to play."
          : !online() ? "Press Next round to flip the first cards."
          : (game.lead === net.me ? "You play" : "Your opponent plays") +
            " the first card. After that, the winner of each round plays first.");
  updateControls();
  pump();                                // online: the opponent may have played while the cards were being dealt
  tryProceed();                          // Draw 3: the computer picks its first card
}

// ---------- Online play: two browsers connected directly to each other (PeerJS / WebRTC) ----------
// The host shuffles and sends the deck. After that each browser runs the same game by itself and
// the two only exchange button presses. The players take turns: one plays a card, then the other.
// The host plays first in the first round; after that the winner of a round plays first in the next.

const PEERJS_URL = "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js";
const PEERJS_SRI = "sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu";
const ROOM_PREFIX = "war-card-game-";    // keeps these rooms apart from other apps on the shared PeerJS service
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";       // no 0/O or 1/I, which are easy to mix up
const PROTOCOL = 3;                     // raise this whenever the messages or the game rules change

// Online session (`net`): { peer, conn, me, code, live, started, gameNo, point, remotePoint }
//   me: 0 = host (Player 1), 1 = guest (Player 2)      live: the two browsers are connected
//   started: the host's deck has arrived               gameNo: which game of this session this is
//   point: how many presses, by either player, have been played in this game so far
//   remotePoint: the number of the latest press the opponent has sent; it may not have been played here yet

// The online library is only fetched when someone chooses to play online, so solo play works offline.
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = PEERJS_URL;
